name: Build Android APK

# Push to main korle ba Actions tab theke "Run workflow" dile APK baniye Releases e dibe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy web app files into www
        run: |
          mkdir -p www
          tar --exclude='./.git' --exclude='./.github' --exclude='./www' \
              --exclude='./node_modules' --exclude='./android' --exclude='./android-extra' \
              --exclude='*.zip' --exclude='./README.md' \
              --exclude='./package.json' --exclude='./package-lock.json' \
              --exclude='./capacitor.config.json' -cf - . | tar -xf - -C www
          ls -la www
          grep -q 'native-bridge.js' www/index.html

      - name: Write Android extras (share-in plugin + patch script)
        run: |
          mkdir -p android-extra
          cat > android-extra/MainActivity.java <<'EOF'
          package com.nasim.photogallerypro;

          import android.content.Intent;
          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ShareInPlugin.class);
                  super.onCreate(savedInstanceState);
                  if (savedInstanceState == null) {
                      handleShare(getIntent());
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(new Intent(Intent.ACTION_MAIN));
                  handleShare(intent);
              }

              private void handleShare(final Intent intent) {
                  if (intent == null) return;
                  final String action = intent.getAction();
                  if (!Intent.ACTION_SEND.equals(action) && !Intent.ACTION_SEND_MULTIPLE.equals(action)) return;
                  final android.content.Context ctx = getApplicationContext();
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          boolean added = ShareInPlugin.queue(ctx, intent);
                          if (!added) return;
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      if (getBridge() != null && getBridge().getWebView() != null) {
                                          getBridge().getWebView().evaluateJavascript(
                                              "window.dispatchEvent(new Event('nativeShare'))", null);
                                      }
                                  } catch (Exception ignored) {
                                  }
                              }
                          });
                      }
                  }).start();
              }
          }
          EOF
          cat > android-extra/ShareInPlugin.java <<'EOF'
          package com.nasim.photogallerypro;

          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.OpenableColumns;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.List;

          /** Receives files/text shared from other apps and hands them to the web app. */
          @CapacitorPlugin(name = "ShareIn")
          public class ShareInPlugin extends Plugin {

              private static final List<JSObject> PENDING = new ArrayList<>();

              /** Copies everything in a SEND / SEND_MULTIPLE intent into cache and queues it. Runs off the main thread. */
              static boolean queue(Context ctx, Intent intent) {
                  if (intent == null) return false;
                  String action = intent.getAction();
                  if (!Intent.ACTION_SEND.equals(action) && !Intent.ACTION_SEND_MULTIPLE.equals(action)) return false;

                  List<Uri> uris = new ArrayList<>();
                  if (Intent.ACTION_SEND.equals(action)) {
                      Uri one;
                      if (Build.VERSION.SDK_INT >= 33) {
                          one = intent.getParcelableExtra(Intent.EXTRA_STREAM, Uri.class);
                      } else {
                          one = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                      }
                      if (one != null) uris.add(one);
                  } else {
                      ArrayList<Uri> many;
                      if (Build.VERSION.SDK_INT >= 33) {
                          many = intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM, Uri.class);
                      } else {
                          many = intent.getParcelableArrayListExtra(Intent.EXTRA_STREAM);
                      }
                      if (many != null) uris.addAll(many);
                  }

                  String text = intent.getStringExtra(Intent.EXTRA_TEXT);
                  if (text == null) text = "";

                  JSObject entry = new JSObject();
                  entry.put("text", text);
                  JSArray files = new JSArray();
                  File dir = new File(ctx.getCacheDir(), "incoming");
                  if (!dir.exists()) dir.mkdirs();
                  long stamp = System.currentTimeMillis();
                  int i = 0;
                  for (Uri u : uris) {
                      try {
                          ContentResolver cr = ctx.getContentResolver();
                          String name = displayName(cr, u);
                          String type = cr.getType(u);
                          String safe = stamp + "_" + (i++) + "_" + name.replaceAll("[^A-Za-z0-9._-]+", "_");
                          File out = new File(dir, safe);
                          InputStream in = cr.openInputStream(u);
                          if (in == null) continue;
                          OutputStream os = new FileOutputStream(out);
                          try {
                              byte[] buf = new byte[64 * 1024];
                              int n;
                              while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                          } finally {
                              os.close();
                              in.close();
                          }
                          JSObject f = new JSObject();
                          f.put("path", Uri.fromFile(out).toString());
                          f.put("name", name);
                          f.put("type", type == null ? "" : type);
                          files.put(f);
                      } catch (Exception ignored) {
                          // skip a file we cannot read
                      }
                  }
                  entry.put("files", files);
                  if (files.length() == 0 && text.trim().isEmpty()) return false;
                  synchronized (PENDING) {
                      PENDING.add(entry);
                  }
                  return true;
              }

              private static String displayName(ContentResolver cr, Uri u) {
                  String name = null;
                  Cursor c = null;
                  try {
                      c = cr.query(u, null, null, null, null);
                      if (c != null && c.moveToFirst()) {
                          int idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                          if (idx >= 0) name = c.getString(idx);
                      }
                  } catch (Exception ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
                  if (name == null || name.isEmpty()) {
                      String p = u.getLastPathSegment();
                      name = (p == null || p.isEmpty()) ? "shared" : p;
                  }
                  return name;
              }

              @PluginMethod
              public void takeIncoming(PluginCall call) {
                  JSArray arr = new JSArray();
                  synchronized (PENDING) {
                      for (JSObject o : PENDING) arr.put(o);
                      PENDING.clear();
                  }
                  JSObject res = new JSObject();
                  res.put("items", arr);
                  call.resolve(res);
              }
          }
          EOF
          cat > android-extra/patch_android.py <<'EOF'
          #!/usr/bin/env python3
          """Patches the generated Capacitor Android project:
            - Share-to-app intent filters (images, videos, text)
            - navy splash screen + status/navigation bar colour
          Run from the repo root after `npx cap add android`.
          """
          import pathlib
          import re
          import shutil

          ROOT = pathlib.Path("android/app/src/main")
          PKG_DIR = ROOT / "java/com/nasim/photogallerypro"

          # ---- Java sources ----
          PKG_DIR.mkdir(parents=True, exist_ok=True)
          for name in ("MainActivity.java", "ShareInPlugin.java"):
              shutil.copy(pathlib.Path("android-extra") / name, PKG_DIR / name)

          # ---- Manifest: accept shared files ----
          mf = ROOT / "AndroidManifest.xml"
          s = mf.read_text(encoding="utf-8")
          if "android.intent.action.SEND" not in s:
              filters = """
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="video/*" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  """
              i = s.index("</activity>")
              s = s[:i] + filters + s[i:]
              mf.write_text(s, encoding="utf-8")
          print("manifest patched")

          # ---- Splash + bar colours ----
          values = ROOT / "res/values"
          (values / "mgp_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="mgp_navy">#172554</color>\n</resources>\n',
              encoding="utf-8",
          )
          st = values / "styles.xml"
          if st.exists():
              t = st.read_text(encoding="utf-8")
              # splash: navy background instead of the default logo image
              t = t.replace("@drawable/splash", "@color/mgp_navy")
              # status / navigation bar colour for the main theme
              t = re.sub(
                  r'(<style name="AppTheme\.NoActionBar"[^>]*>)',
                  r'\1\n        <item name="android:statusBarColor">@color/mgp_navy</item>'
                  r'\n        <item name="android:navigationBarColor">@color/mgp_navy</item>',
                  t,
                  count=1,
              )
              st.write_text(t, encoding="utf-8")
              print("styles patched")
          EOF

      - name: Create Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/share@7 @capacitor/filesystem@7
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nasim.photogallerypro",
            "appName": "My Photo Gallery Pro",
            "webDir": "www",
            "backgroundColor": "#172554",
            "android": { "adjustMarginsForEdgeToEdge": "auto" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: App icon
        continue-on-error: true
        run: |
          GLYPH=(-fill white -draw "roundrectangle 192,340 832,760 60,60" -draw "roundrectangle 380,270 644,360 30,30" -fill '#172554' -draw "circle 512,550 512,670" -fill '#1d4ed8' -draw "circle 512,550 512,630")
          convert -size 1024x1024 xc:'#172554' "${GLYPH[@]}" /tmp/icon_full.png
          convert -size 1024x1024 xc:none "${GLYPH[@]}" -resize 70% -background none -gravity center -extent 1024x1024 /tmp/icon_fg.png
          find android/app/src/main/res -name 'ic_launcher*.png' | while read -r f; do
            size=$(identify -format '%w' "$f")
            case "$f" in
              *foreground*) src=/tmp/icon_fg.png ;;
              *) src=/tmp/icon_full.png ;;
            esac
            convert "$src" -resize "${size}x${size}" "PNG32:$f"
          done
          sed -i 's/#[0-9A-Fa-f]\{6\}/#172554/' android/app/src/main/res/values/ic_launcher_background.xml

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Same signing key every build, so a new APK installs over the old one without losing app data.
      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: apk-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # First try with "Share to app" + splash/status bar colour.
      # If that extra part fails to compile, build again without it so you still get a working APK.
      - name: Build APK
        run: |
          cp -r android/app/src /tmp/src-backup
          python3 android-extra/patch_android.py
          cd android
          chmod +x gradlew
          if ./gradlew assembleDebug --no-daemon; then
            echo "full build ok (share-in included)"
          else
            echo "::warning::Share-in part failed, rebuilding without it"
            cd ..
            rm -rf android/app/src && cp -r /tmp/src-backup android/app/src
            cd android
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MyPhotoGalleryPro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyPhotoGalleryPro-apk
          path: MyPhotoGalleryPro.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: "Download MyPhotoGalleryPro.apk below and install it on your Android phone."
          files: MyPhotoGalleryPro.apk
